[pytest]
asyncio_mode=strict
# Used for ./tests/pytest/asyncio_prevent.py
asyncio_default_fixture_loop_scope=function
testpaths=tests/pytest/
; Note: Browsers are set within `./Makefile`
addopts = --strict-markers --durations=6 --durations-min=5.0 --numprocesses auto
; No test may take more than 2 minutes, so a hang fails instead of running until
; CI cancels the job. The `thread` method kills the hung xdist worker (which
; xdist reports as a failure of that test); its own stack dump is lost in the
; worker's IPC pipe, so faulthandler dumps every thread's stack to stderr first.
; (Same approach as the Playwright targets in the Makefile.)
timeout = 120
timeout_method = thread
faulthandler_timeout = 110
; Tests must not emit stray warnings; assert expected ones with `pytest.warns()`.
; Third-party deprecations we can't act on go in the ignore list below.
filterwarnings =
    error
    ; narwhals calls polars' deprecated `cat.get_categories()`
    ; https://github.com/narwhals-dev/narwhals/issues/3895
    ignore:`cat.get_categories\(\)` is deprecated:DeprecationWarning
    ; starlette's `TestClient` module annotates with `anyio.abc.BlockingPortal`,
    ; whose alias anyio 4.15.0 deprecated -- so as an error it breaks *collection*
    ; of any test importing `starlette.testclient`. Fixed on starlette's master by
    ; https://github.com/encode/starlette/pull/3498 but unreleased as of 1.6.0;
    ; delete this once we require the release that contains it.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ; Both of these are raised from finalizers at GC time (a leaked
    ; `TemporaryDirectory`, an abandoned coroutine), so as errors they fail
    ; whichever test happens to be running when the collector fires rather than the
    ; test at fault -- i.e. they make the suite flaky instead of strict.
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ; When a timeout kills an xdist worker, syrupy warns that the killed worker's
    ; tests are missing; as an error, that hides the summary naming the hung test.
    ignore:.*selected test\(s\) missing from collected items:UserWarning
; verbosity_test_cases=2
