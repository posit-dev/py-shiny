# One-off check for #1381 (busy indicators that do not show on Windows). Each
# variant runs the busy-indicator progress test ten times on Windows:
#
# - main: the released behavior.
# - this-branch: a yield after each output's "recalculating" message.
# - this-branch-no-yield: the same without that yield. The test must fail here.
name: Windows busy indicator check (#1381)

on:
  push:
    branches: ["jat255/2508-windows-busy-indicator-check"]
  workflow_dispatch:

jobs:
  busy-indicator:
    name: ${{ matrix.target }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - main
          - this-branch
          - this-branch-no-yield
    steps:
      - name: Check out the code under test
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.target == 'main' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Check out the test
        uses: actions/checkout@v6
        with:
          path: .harness

      - name: Remove the yield after the "recalculating" message
        if: matrix.target == 'this-branch-no-yield'
        shell: python
        run: |
          import pathlib
          import re
          import sys

          path = pathlib.Path("shiny/session/_session.py")
          text, count = re.subn(
              r"(# https://github\.com/posit-dev/py-shiny/issues/1381\n)"
              r"[ \t]*await asyncio\.sleep\(0\)\n",
              r"\1",
              path.read_text(),
          )
          if count != 1:
              sys.exit(f"{path}: expected 1 yield, found {count}")
          path.write_text(text)
          print(f"{path}: removed the yield")

      - name: Setup py-shiny
        uses: ./.github/py-shiny/setup
        with:
          python-version: "3.12"

      - name: Add the test
        shell: bash
        run: |
          cp -r .harness/tests/playwright/shiny/bugs/1381-busy-indicator-progress \
            tests/playwright/shiny/bugs/

      - name: Install chromium
        shell: bash
        run: playwright install chromium

      - name: Run the test ten times
        shell: bash
        run: |
          status=0
          for i in $(seq 10); do
            echo "::group::Run $i"
            pytest -p no:xdist -o addopts="" -s --browser chromium \
              tests/playwright/shiny/bugs/1381-busy-indicator-progress || status=1
            echo "::endgroup::"
          done
          exit $status
